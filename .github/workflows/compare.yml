# Daily new-snow comparison: the model (MODEL_SITE) against PowderGuide
# (ICON-EU, forecast for tomorrow) and SLF/WhiteRisk HN1D (measured).
# The day's numbers go to history.csv on the branch «history»; the report
# is in the run summary and kept as artifact for 30 days.
name: Compare new snow

on:
  # Zeitplan vorerst ausgeschaltet (nur von Hand: Actions -> Run workflow).
  # schedule:
  #   - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: History so far
        run: |
          mkdir -p out
          if git fetch --depth 1 origin history 2>/dev/null; then
            git show FETCH_HEAD:history.csv > out/history.csv 2>/dev/null || true
          fi

      - name: Compare
        env:
          MODEL_SITE: ${{ secrets.MODEL_SITE }}
        run: python compare_newsnow.py --out out --history out/history.csv

      - name: Summary
        if: always()
        run: test -f out/report.md && cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.run_id }}
          path: out/
          retention-days: 30

      - name: Store history
        run: |
          d=$(date -u +%F)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf hist && mkdir hist && cd hist && git init -q
          git remote add origin "$(git -C .. remote get-url origin)"
          git config http.https://github.com/.extraheader "$(git -C .. config --get http.https://github.com/.extraheader)"
          if git fetch -q --depth 1 origin history 2>/dev/null; then git checkout -q -b history FETCH_HEAD; else git checkout -q --orphan history; fi
          cp ../out/history.csv history.csv
          mkdir -p "reports/$d" && cp ../out/report.md ../out/maps.png "reports/$d/"
          cp ../out/report.md latest.md
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "compare $d"
          git push -q origin HEAD:history
